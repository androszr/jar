<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Jars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <canvas id="view" tabindex="0" role="button" aria-label="A potting table with a glass jar holding a city. Press Enter to lift the jar."></canvas>
  </div>
  <nav id="shelfnav" hidden>
    <button id="prev" type="button" aria-label="previous jar">&lsaquo;</button>
    <button id="next" type="button" aria-label="next jar">&rsaquo;</button>
  </nav>
  <button id="back" type="button" hidden>back to the table</button>
  <a id="credit" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Weather data by Open-Meteo</a>
  <div id="scrubrow" hidden><label for="scrub" id="scrublabel">next 24 hours</label><input id="scrub" type="range" min="0" max="1440" step="30" value="0"><button id="now" type="button">now</button></div>
  <p class="visually-hidden" id="announce" aria-live="polite" aria-atomic="true"></p>
  <script type="module" src="main.js"></script>
</body>
</html>
